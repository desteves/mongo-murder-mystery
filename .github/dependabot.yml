# One pull request a week with every update bundled together (all ecosystems and directories), opened Monday.
# Every merge to main deploys all three services, so skim the PR, run `scripts/smoke-images.sh`, then merge.
# Majors of Node (we pin the LTS on purpose) and of mongodb-mcp-server (v3 changed binding and connection semantics)
# are ignored: bump those by hand.
version: 2

multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]

updates:
  - package-ecosystem: npm
    directory: /app-backend
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: npm
    directory: /app-frontend/murdermystery
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: npm
    directory: /app-mcp
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "mongodb-mcp-server"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /app-backend
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /app-frontend/murdermystery
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /app-mcp
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directory: /infra
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
