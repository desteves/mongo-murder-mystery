server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health check endpoint for Cloud Run
  location /healthz {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
    include /etc/nginx/security-headers.conf;
  }

  # Security headers. nginx drops server-level add_header directives in any location that defines its own,
  # so the headers live in one snippet that every location includes.
  include /etc/nginx/security-headers.conf;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss text/xml;
  gzip_min_length 512;

  # Cache hashed assets aggressively (Vite generates hashed filenames)
  location ~* "^/assets/.*\.[a-f0-9]{8,}\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
    access_log off;
  }

  # Don't cache HTML and other non-hashed assets
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    include /etc/nginx/security-headers.conf;
    expires 0;
  }
}
