server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Health check endpoint for Cloud Run
  location /healthz {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
    include /etc/nginx/security-headers.conf;
  }

  # Security headers. nginx drops server-level add_header directives in any location that defines its own,
  # so the headers live in one snippet that every location includes.
  include /etc/nginx/security-headers.conf;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  # nginx serves .js as text/javascript, so it must be listed (otherwise scripts are sent uncompressed)
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml application/xml+rss text/xml;
  gzip_min_length 512;

  # Everything Vite emits under /assets is content-hashed (name-HASH.ext), so it can be cached forever. (The earlier pattern
  # expected name.hexhash.ext and never matched Vite's names, so these files were sent as no-store.)
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
    access_log off;
  }

  # Hero images are named by width (hero-560.webp). Treat them as immutable and rename the file when the picture changes, so
  # repeat visits never re-download them (PageSpeed flags a one-day TTL on the LCP image).
  location ~ "^/hero-[0-9]+\.webp$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
    access_log off;
  }

  # Other static files that are not content-hashed (images in /public, icons, llms.txt, robots, sitemap): a day, and a week of
  # stale-while-revalidate, so repeat visits do not re-download them and a change still shows up within a day.
  location ~* "\.(ico|webp|png|svg|txt|xml)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    include /etc/nginx/security-headers.conf;
    access_log off;
  }

  # Don't cache HTML and other non-hashed assets
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma "no-cache";
    include /etc/nginx/security-headers.conf;
    expires 0;
  }
}
